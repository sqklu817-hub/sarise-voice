<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ご来店ありがとうございました | Sarise</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
:root {
  --bg: #fffdf8;
  --card: #fff;
  --primary: #c84b2f;
  --pl: #f5e6e2;
  --pd: #8b3320;
  --accent: #e8a020;
  --al: #fef3cd;
  --text: #2c2017;
  --muted: #8c7b6b;
  --border: #ede5db;
  --ok: #2d7a4f;
  --okl: #e8f5ee;
  --r: 14px;
  --sh: 0 4px 20px rgba(44, 32, 23, .09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.w { max-width: 500px; margin: 0 auto; padding: 1.2rem 1rem 2.5rem; }
.hd { text-align: center; padding: 1.5rem 0 1.2rem; }
.hd em { font-size: 2.4rem; display: block; margin-bottom: .4rem; font-style: normal; }
.hd h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd p { font-size: .78rem; color: var(--muted); line-height: 1.7; margin-top: .3rem; }
.pg { margin: .8rem 0 1rem; }
.pgl { font-size: .72rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: .35rem; }
.pgb { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; }
.pgf { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 999px; transition: width .45s ease; }
.card { background: var(--card); border-radius: var(--r); padding: 1.3rem; box-shadow: var(--sh); border: 1px solid var(--border); margin-bottom: .8rem; display: none; }
.card.on { display: block; }
.ql { font-size: .7rem; font-weight: 700; color: var(--primary); letter-spacing: .1em; margin-bottom: .45rem; display: flex; align-items: center; gap: .35rem; }
.ql::before { content: ''; width: 18px; height: 3px; background: var(--primary); border-radius: 2px; }
.qh { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.5; }
.star-options { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .5rem; }
.star-opt {
  display: grid;
  grid-template-columns: minmax(4.8em, auto) minmax(0, 1fr) auto 24px;
  align-items: center;
  gap: .45rem;
  padding: .65rem .9rem .65rem .8rem;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: #fff;
  cursor: pointer;
  overflow: hidden;
}
.star-opt.on, .star-opt:hover { border-color: var(--accent); background: var(--al); }
.star-opt-stars { font-size: 1.1rem; line-height: 1; flex-shrink: 0; white-space: nowrap; }
.star-opt-label {
  font-size: .85rem;
  font-weight: 700;
  color: var(--muted);
  min-width: 0;
  white-space: nowrap;
  word-break: keep-all;
  overflow: hidden;
  text-overflow: ellipsis;
}
.star-opt-num { font-size: .78rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
.star-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: .7rem; justify-self: end; }
.star-opt.on .star-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.star-opt.on .star-opt-label { color: var(--pd); }
.star-opt.on .star-opt-num { color: var(--accent); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { padding: .45rem .9rem; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg); font-size: .82rem; font-weight: 500; color: var(--muted); cursor: pointer; }
.chip.on { background: var(--pl); border-color: var(--primary); color: var(--pd); font-weight: 700; }
.sl { font-size: .82rem; font-weight: 700; margin: .85rem 0 .45rem; color: var(--muted); }
textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: .75rem .9rem; font-size: .88rem; background: var(--bg); min-height: 85px; line-height: 1.7; }
.cc { font-size: .7rem; color: var(--muted); text-align: right; margin-top: .25rem; }
.note { background: var(--al); border-radius: 8px; padding: .55rem .8rem; font-size: .75rem; color: #7a5a10; margin-top: .55rem; line-height: 1.6; }
.nav { display: flex; gap: .5rem; margin-top: 1rem; }
.nx { flex: 1; padding: .78rem; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer; }
.nx:disabled { opacity: .38; cursor: not-allowed; }
.bk { padding: .78rem 1rem; background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); border-radius: 10px; font-size: .85rem; cursor: pointer; }
.lcard,.rcard,.ccard { background: var(--card); border-radius: var(--r); padding: 1.3rem; box-shadow: var(--sh); border: 1px solid var(--border); display: none; }
.lcard.on,.rcard.on,.ccard.on { display: block; }
.rhd { text-align: center; margin-bottom: 1.1rem; }
.rtl { font-size: 1.05rem; font-weight: 700; color: var(--ok); }
.rsb { font-size: .78rem; color: var(--muted); margin-top: .25rem; line-height: 1.6; }
.rbox { background: var(--okl); border: 1.5px solid #a8d5be; border-radius: 10px; padding: 1rem; font-size: .88rem; line-height: 1.95; color: var(--text); white-space: pre-wrap; margin-bottom: .8rem; }
.bcp,.bgg,.brg { width: 100%; border-radius: 10px; padding: .82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; }
.bcp { background: var(--ok); color: #fff; border: none; margin-bottom: .6rem; }
.bgg { background: #4285f4; color: #fff; border: none; margin-bottom: .6rem; }
.brg { background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); }
.bcoupon { width: 100%; border-radius: 10px; padding: .82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .45rem; border: none; background: var(--accent); color: #fff; margin-top: .6rem; }
.foot { text-align: center; margin-top: 1.5rem; font-size: .7rem; color: var(--muted); opacity: .6; }
#toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--text); color: #fff; padding: .6rem 1.3rem; border-radius: 999px; font-size: .82rem; opacity: 0; transition: all .28s; z-index: 999; white-space: nowrap; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 420px) {
  .star-opt { grid-template-columns: minmax(4.2em, auto) minmax(0, 1fr) auto 20px; gap: .35rem; }
  .star-opt-stars { font-size: 1rem; }
  .star-opt-label { font-size: .8rem; }
  .star-opt-num { font-size: .75rem; }
}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <em>🍽️</em>
    <h1 id="snm">ご来店ありがとうございます</h1>
    <p>簡単なアンケートにお答えいただくと<br>口コミ文を自動で作成します ✨</p>
  </div>
  <div class="pg" id="pgw">
    <div class="pgl"><span id="ptxt">質問 1 / 7</span><span id="ppct">0%</span></div>
    <div class="pgb"><div class="pgf" id="pf" style="width:0%"></div></div>
  </div>

  <div id="qContainer"></div>

  <div class="lcard" id="lcard"><div style="font-size:1rem;font-weight:700">口コミ文を作成中です</div><div style="font-size:.85rem;color:var(--muted);margin-top:.6rem">AIがご回答をもとに文章を生成しています...</div></div>

  <div class="rcard" id="rcard">
    <div class="rhd"><div class="rtl">口コミ文ができました！</div><div class="rsb">下の文章をコピーして<br>Googleの口コミに貼り付けてください</div></div>
    <div class="rbox" id="gentext" onclick="cpReview()">（生成中...）</div>
    <div id="charCount" style="text-align:right;font-size:.75rem;color:var(--muted);margin-top:.3rem"></div>
    <button class="bcp" id="bcopy" onclick="cpReview()">📋 口コミ文をコピーする</button>
    <a class="bgg" id="bgg" href="#" target="_blank" rel="noopener">🔍 Googleの口コミページを開く</a>
    <button class="brg" onclick="regen()">🔄 別の文章を作り直す</button>
    <button class="bcoupon" id="bcoupon" onclick="showCoupon()" style="display:none">🎁 アンケート回答のお礼クーポンを受け取る</button>
  </div>
  <div class="ccard" id="ccard"></div>
  <div class="foot">Powered by Sarise</div>
</div>
<div id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const STORE = params.get('store') || params.get('s') || 'お店';
const GG_URL = params.get('url') || params.get('u') || '';
// 業種判定（URLパラメータ industry）。指定なし・不正値は飲食店扱い（後方互換）
const INDUSTRY = (() => {
  const v = (params.get('industry') || '').toLowerCase();
  return ['food', 'beauty', 'seikotsuin'].includes(v) ? v : 'food';
})();
// お礼クーポンデータ（c パラメータ・LZString圧縮）。enabled:true のときだけ採用
const COUPON = (() => {
  const cp = params.get('c');
  if(!cp || typeof LZString === 'undefined') return null;
  try{
    const decompressed = LZString.decompressFromEncodedURIComponent(cp);
    const parsed = JSON.parse(decompressed);
    if(parsed && typeof parsed === 'object' && parsed.enabled === true) return parsed;
  }catch(e){ console.error('クーポンデータの読み込みに失敗', e); }
  return null;
})();
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

// templateパラメータから質問セットを選択
const TEMPLATE_QUESTIONS = {
  food: [
    {id:'fq1',title:'全体的なご満足度を教えてください',type:'single',options:['最高でした！','良かったです','普通でした','もう少しでした','がっかりでした']},
    {id:'fq2',title:'今回のご来店のきっかけを教えてください',type:'single',options:['Instagram','TikTok','食べログ','ホットペッパー','ぐるなび','Google検索','知人の紹介','もともと知っていた','通りがかり']},
    {id:'fq3',title:'今日の来店目的を教えてください',type:'single',options:['ランチ','ディナー','誕生日','記念日・お祝い','デート','接待・会食','友人との食事','家族での食事','一人ご飯']},
    {id:'fq4',title:'お店の雰囲気はどうでしたか',type:'single',options:['とても良かった','落ち着けた','賑やかで楽しかった','普通だった']},
    {id:'fq5',title:'特に良かった点を教えてください',type:'multi',options:['料理の美味しさ','接客の良さ','雰囲気','価格の満足度','清潔感']},
    {id:'fq6',title:'特に良かったメニュー・料理を教えてください',type:'text',options:[]},
    {id:'fq7',title:'ひとことご感想をお聞かせください',type:'text',options:[]}
  ],
  beauty: [
    {id:'bq1',title:'全体的なご満足度を教えてください',type:'single',options:['最高でした！','良かったです','普通でした','もう少しでした','がっかりでした']},
    {id:'bq2',title:'今回のご来店のきっかけを教えてください',type:'single',options:['Instagram','TikTok','ホットペッパービューティー','Google検索','知人の紹介','以前から通っている']},
    {id:'bq3',title:'本日のメニューを教えてください',type:'single',options:['カット','カラー','パーマ','トリートメント','その他']},
    {id:'bq4',title:'お店の雰囲気はどうでしたか',type:'single',options:['とてもおしゃれだった','落ち着けた','清潔感があった','普通だった']},
    {id:'bq5',title:'特に良かった点を教えてください',type:'multi',options:['仕上がりの満足度','スタッフの対応','居心地の良さ','価格の満足度','清潔感']},
    {id:'bq6',title:'ひとことご感想をお聞かせください',type:'text',options:[]}
  ],
  seikotsuin: [
    {id:'sq1',title:'全体的なご満足度を教えてください',type:'single',options:['最高でした！','良かったです','普通でした','もう少しでした','がっかりでした']},
    {id:'sq2',title:'今回のご来院のきっかけを教えてください',type:'single',options:['Google検索','TikTok','知人の紹介','チラシ','以前から通っている','通りがかり']},
    {id:'sq3',title:'本日の施術内容を教えてください',type:'single',options:['肩こり','腰痛','膝の痛み','骨盤矯正','スポーツによる怪我','その他']},
    {id:'sq4',title:'お店の雰囲気はどうでしたか',type:'single',options:['清潔感があった','落ち着けた','スタッフが明るかった','普通だった']},
    {id:'sq5',title:'特に良かった点を教えてください',type:'multi',options:['施術の効果','スタッフの対応','説明のわかりやすさ','待ち時間の少なさ','清潔感']},
    {id:'sq6',title:'ひとことご感想をお聞かせください',type:'text',options:[]}
  ]
};

function normalizeQuestion(q, idx){
  if(Array.isArray(q)){
    q = {title:q[0], type:q[1], options:q[2]};
  }
  if(!q || typeof q !== 'object') return null;
  const typeMap = {s:'single', m:'multi', t:'text'};
  const rawType = typeMap[q.type] || q.type;
  const type = ['single','multi','text'].includes(rawType) ? rawType : 'single';
  const title = typeof q.title === 'string' && q.title.trim() ? q.title.trim() : `質問${idx+1}`;
  const options = type === 'text' ? [] : (Array.isArray(q.options) ? q.options.map(v=>String(v).trim()).filter(Boolean) : []);
  if(type !== 'text' && !options.length) return null;
  return {id: typeof q.id === 'string' ? q.id : `cq${idx+1}`, title, type, options};
}
function fallbackQuestions(){
  const templateId = params.get('template') || 'food';
  return TEMPLATE_QUESTIONS[templateId] || TEMPLATE_QUESTIONS.food;
}
function resolveQuestions(){
  const customQuestionsParam = params.get('q');
  if(customQuestionsParam){
    try{
      if(typeof LZString === 'undefined') throw new Error('LZString is not loaded');
      const decompressed = LZString.decompressFromEncodedURIComponent(customQuestionsParam);
      const customQuestions = JSON.parse(decompressed);
      const normalized = Array.isArray(customQuestions)
        ? customQuestions.map(normalizeQuestion).filter(Boolean)
        : [];
      if(normalized.length > 0) return normalized;
      throw new Error('Invalid custom questions');
    }catch(e){
      console.error('カスタム質問の読み込みに失敗。デフォルトテンプレを使用', e);
    }
  }
  return fallbackQuestions();
}
const QUESTIONS = resolveQuestions();
const TOTAL = QUESTIONS.length;
let ANS = new Array(TOTAL).fill(null);

// 店舗名・口コミURL設定
document.getElementById('snm').textContent = STORE + 'へのご来店ありがとうございます';
const bggEl = document.getElementById('bgg');
if(GG_URL){
  bggEl.href = GG_URL;
} else {
  bggEl.removeAttribute('href');
  bggEl.style.opacity = '0.4';
  bggEl.style.cursor = 'not-allowed';
  bggEl.title = '口コミURLが設定されていません';
  bggEl.onclick = e => { e.preventDefault(); alert('口コミURLが設定されていません。管理画面で口コミURLを登録し、QRコードを再生成してください。'); };
}

// 質問カードを動的に生成
function buildQCards(){
  const container = document.getElementById('qContainer');
  const starSymbols = ['★★★★★','★★★★','★★★','★★','★'];
  container.innerHTML = QUESTIONS.map((q, i) => {
    const n = i + 1;
    const isFirst = i === 0;
    const isLast = i === QUESTIONS.length - 1;
    const qlLabel = isLast ? `質問 ${n}（最後です！）` : `質問 ${n}`;
    const onNext = isLast ? 'startGen()' : `qNext(${n})`;
    const nextLabel = isLast ? '✨ 口コミ文を作成する' : '次へ →';

    let body = '';
    let nextDisabled = true;

    if(isFirst && q.type !== 'text'){
      // Q1 はスター UI
      const opts = q.options || ['最高でした！','良かったです','普通でした','もう少しでした','がっかりでした'];
      body = `<div class="star-options">${[5,4,3,2,1].map((v,j) =>
        `<div class="star-opt" onclick="setStar(${v})">` +
        `<div class="star-opt-stars">${starSymbols[j] || '★'}</div>` +
        `<div class="star-opt-label">${esc(opts[j] || '')}</div>` +
        `<div class="star-opt-num">${v}点</div>` +
        `<div class="star-check" id="sc${v}"></div>` +
        `</div>`
      ).join('')}</div>`;
      nextDisabled = true;
    } else if(q.type === 'text'){
      body = `<textarea id="ta_${n}" placeholder="（なければ空白でもOKです）" oninput="ccount(this,'cc_${n}')" maxlength="150" autocomplete="off"></textarea>` +
             `<div class="cc" id="cc_${n}">0 / 150文字</div>`;
      nextDisabled = false; // 自由記述は任意
    } else {
      // single / multi はチップ UI
      const isMulti = q.type === 'multi';
      body = `<div class="chips" id="cpg_${n}">${(q.options || []).map(opt =>
        `<div class="chip" onclick="pickDyn(this,${n},${isMulti})">${esc(opt)}</div>`
      ).join('')}</div>`;
      nextDisabled = true;
    }

    const backBtn = isFirst ? '' : `<button class="bk" onclick="qBack(${n})">← 戻る</button>`;
    const nextBtn = `<button class="nx" id="nb${n}" onclick="${onNext}"${nextDisabled ? ' disabled' : ''}>${nextLabel}</button>`;
    const nav = `<div class="nav">${backBtn}${nextBtn}</div>`;

    return `<div class="card${isFirst ? ' on' : ''}" id="q${n}">` +
           `<div class="ql">${qlLabel}</div>` +
           `<div class="qh">${esc(q.title)}</div>` +
           `${body}${nav}</div>`;
  }).join('');
}

function upProg(n){
  const p = Math.round(((n - 1) / TOTAL) * 100);
  document.getElementById('pf').style.width = p + '%';
  document.getElementById('ptxt').textContent = '質問 ' + n + ' / ' + TOTAL;
  document.getElementById('ppct').textContent = p + '%';
}

function showQ(n){
  document.querySelectorAll('.card').forEach(c => c.classList.remove('on'));
  document.getElementById('lcard').classList.remove('on');
  document.getElementById('rcard').classList.remove('on');
  const el = document.getElementById('q' + n);
  if(el) el.classList.add('on');
  upProg(n);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function qNext(n){ showQ(n + 1); }
function qBack(n){ showQ(n - 1); }
// 後方互換エイリアス
function go(n){ qNext(n); }
function back(n){ qBack(n); }

// Q1 スター選択
function setStar(v){
  ANS[0] = v;
  document.querySelectorAll('.star-opt').forEach(o => o.classList.remove('on'));
  document.querySelectorAll('.star-check').forEach(c => c.textContent = '');
  document.querySelectorAll('.star-opt')[5 - v].classList.add('on');
  const sc = document.getElementById('sc' + v);
  if(sc) sc.textContent = '✓';
  const nb = document.getElementById('nb1');
  if(nb) nb.disabled = false;
}

// チップ選択（single / multi）
function pickDyn(el, n, isMulti){
  const grp = document.getElementById('cpg_' + n);
  const i = n - 1;
  if(!isMulti){
    grp.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    ANS[i] = el.textContent.trim();
  } else {
    el.classList.toggle('on');
    ANS[i] = Array.from(grp.querySelectorAll('.chip.on')).map(c => c.textContent.trim());
  }
  const nb = document.getElementById('nb' + n);
  if(nb) nb.disabled = isMulti ? (ANS[i].length === 0) : false;
}

function ccount(el, id){ document.getElementById(id).textContent = el.value.length + ' / ' + el.maxLength + '文字'; }

// テキスト回答を収集
function collectTextAnswers(){
  QUESTIONS.forEach((q, i) => {
    if(q.type === 'text'){
      const ta = document.getElementById('ta_' + (i + 1));
      if(ta) ANS[i] = ta.value.trim();
    }
  });
}

function sanitizeGeneratedText(text){
  const normalized = String(text || '')
    .replace(/\r?\n+/g, '')
    .replace(/[ \t\u3000]+/g, '')
    .trim();
  return normalized
    .replace(/^「(.+)」$/, '$1')
    .replace(/^"(.+)"$/, '$1')
    .trim();
}

// ===== 業種別 口コミ文章テンプレート =====
// industry: food（飲食店）/ beauty（美容サロン）/ seikotsuin（整体院）
const TRIGGER_MAPS = {
  food: {
    'Instagram':                  'Instagramで見て気になり、',
    'TikTok':                     'TikTokで見て気になり、',
    '食べログ':                   '食べログを見て気になり、',
    'ホットペッパー':             'ホットペッパーを見て気になり、',
    'ホットペッパービューティー': 'ホットペッパービューティーを見て気になり、',

  food: items =>
    items.length === 1 ? items[0] + 'が印象的でした。'
    : items.length === 2 ? items[0] + 'や' + items[1] + 'が良かったです。'
    : items[0] + 'や' + items[1] + '、' + items.slice(2).join('・') + 'も満足でした。',

    : items.length === 2 ? items[0] + 'や' + items[1] + 'がとても良かったです。'
    : items[0] + 'や' + items[1] + 'をはじめ、' + items.slice(2).join('・') + 'も大変満足でした。'
};

// マップに無い回答が来たときの自然な言い回しフォールバック
function resolveTrigger(ans){
  const s = String(ans);
  // 既に動詞を含む場合（「見つけた」「見て」「通っている」など）はそのまま助詞でつなぐ
  if(s.match(/(見つけ|見て|聞いて|通って|知って|来て)/)) return s + '、';
  // 名詞っぽい場合
  return s + 'をきっかけに、';
}
function resolvePurpose(ans){
  const s = String(ans);
  if(INDUSTRY === 'beauty')     return s + 'でお世話になりました。';
  if(INDUSTRY === 'seikotsuin') return s + 'のため伺いました。';
  return s + 'で利用しました。';
}
// 「来店目的 / 施術内容 / メニュー」に相当する質問かを業種別に判定
// （飲食店=「目的」、美容=「メニュー」、整体院=「施術内容」など）
function isPurposeQuestion(title){
  const t = String(title || '');
  if(t.includes('目的')) return true;
  if(INDUSTRY === 'beauty' && (t.includes('メニュー') || t.includes('施術'))) return true;
  if(INDUSTRY === 'seikotsuin' && (t.includes('施術') || t.includes('症状') || t.includes('お悩み'))) return true;
  return false;
}

function buildReview(){
  collectTextAnswers();

  // 業種別のマップ・フォールバックを選択（不正値は飲食店）
  const TRIGGER_MAP = TRIGGER_MAPS[INDUSTRY] || TRIGGER_MAPS.food;
  const PURPOSE_MAP = PURPOSE_MAPS[INDUSTRY] || PURPOSE_MAPS.food;
  const ATMOSPHERE_MAP = ATMOSPHERE_MAPS[INDUSTRY] || ATMOSPHERE_MAPS.food;
  const FALLBACK = FALLBACK_TEXTS[INDUSTRY] || FALLBACK_TEXTS.food;
  const VERBS = ACTION_VERBS[INDUSTRY] || ACTION_VERBS.food;
  const buildGoodPoint = GOODPOINT_BUILDERS[INDUSTRY] || GOODPOINT_BUILDERS.food;

  let triggerPart = '';
  let purposePart = '';
  let atmosphereSentence = '';
  let menuSentence = '';
  let goodPointSentence = '';
  let goodPointAns = [];
  let freeSentence = '';
  let satisfactionHigh = false;

  QUESTIONS.forEach((q, i) => {
    const ans = ANS[i];
    const title = q.title || '';

    if(i === 0){
      // ★4〜5（高評価）を「満足度が高い」と判定
      satisfactionHigh = (typeof ans === 'number') ? ans >= 4 : false;
      return;
    }
    if(ans === null || ans === undefined || ans === '') return;
    if(Array.isArray(ans) && ans.length === 0) return;

    const ansStr = Array.isArray(ans) ? ans[0] : String(ans);

    if(title.includes('きっかけ')){
      triggerPart = TRIGGER_MAP[ansStr] || resolveTrigger(ansStr);
      return;
    }
    if(isPurposeQuestion(title)){
      purposePart = PURPOSE_MAP[ansStr] || resolvePurpose(ansStr);
      return;
    }
    if(title.includes('雰囲気')){
      const mapped = ATMOSPHERE_MAP[ansStr];
      if(mapped != null) atmosphereSentence = mapped;
      return;
    }
    if((title.includes('メニュー') || title.includes('料理')) && q.type === 'text'){
      const val = String(ans).trim();
      if(val) menuSentence = val + 'が特に美味しくおすすめです。';
      return;
    }
    if(title.includes('良かった') && q.type === 'multi'){
      const items = Array.isArray(ans) ? ans : [ansStr];
      goodPointAns = items;
      goodPointSentence = buildGoodPoint(items);
      return;
    }
    if(q.type === 'text'){
      const val = String(ans).trim();
      if(val) freeSentence = val.match(/[。！!？?]$/) ? val : val + '。';
    }
  });

  // ①② きっかけ＋目的を1文に結合
  let openSentence = '';
  if(triggerPart && purposePart){
    openSentence = triggerPart + purposePart;
  } else if(triggerPart){
    const end = (triggerPart.endsWith('って') && INDUSTRY === 'food') ? '入りました。' : (VERBS.visit + 'しました。');
    openSentence = triggerPart + end;
  } else if(purposePart){
    openSentence = purposePart;
  }

  // デフォルト文（回答が空のパーツを補完）
  const effectiveAtmosphere = atmosphereSentence || FALLBACK.atmosphere;
  const effectiveGoodPoint  = goodPointSentence  || FALLBACK.goodPoint;

  // すべての文を順番に結合（closingは最後に1回だけ）
  const closing = satisfactionHigh ? FALLBACK.closing : '';
  const bodyParts = [openSentence, effectiveAtmosphere, menuSentence, effectiveGoodPoint, freeSentence].filter(Boolean);
  let text = bodyParts.join('');

  if(!text.trim()) text = `${STORE}はとても満足できるお店でした。`;

  const closingKeywords = ['また来たい','また利用','またお邪魔','また訪れ','また行きたい','リピート','また通い','また定期的','通わせて','素敵なサロン'];
  const hasClosing = () => closingKeywords.some(k => text.includes(k));

  // closingを1回だけ追加（重複チェック）
  if(closing && !hasClosing()) text += closing;

  // 200文字超 → 自由記述を省略
  if(text.length > 200 && freeSentence){
    const trimmed = [openSentence, effectiveAtmosphere, menuSentence, effectiveGoodPoint].filter(Boolean);
    text = trimmed.join('');
    if(closing && !hasClosing()) text += closing;
  }

  // まだ200超 → 良かった点を上位3つに絞る
  if(text.length > 200 && goodPointAns.length > 3){
    const top3 = goodPointAns.slice(0, 3);
    const newGood = buildGoodPoint(top3);
    text = text.replace(effectiveGoodPoint, newGood);
  }

  // まだ200超 → closingを除去
  if(text.length > 200 && closing){
    text = text.replace(closing, '');
  }

  // 150未満 → closingを優先、それでも足りなければ補足文
  if(text.length < 150){
    if(closing && !hasClosing()){
      text += closing;
    }
    if(text.length < 150 && !text.includes(FALLBACK.extraSentence) && !hasClosing()){
      text = text.replace(/[。！!]$/, '') + '。' + FALLBACK.extraSentence;
    }
  }

  return text;
}

// ===== お礼クーポン（cパラメータが有効な場合のみ表示） =====
const COUPON_THEMES = {
  orange: {main:'#e67e22', bg:'#fff8f1', border:'#e67e22'},
  pink:   {main:'#e91e63', bg:'#fff0f6', border:'#e91e63'},
  blue:   {main:'#2196f3', bg:'#f0f7ff', border:'#2196f3'},
  green:  {main:'#4caf50', bg:'#f0fff4', border:'#4caf50'},
  black:  {main:'#2c2c2c', bg:'#fafafa', border:'#2c2c2c'}
};
function formatCouponExpiry(coupon){
  if(coupon.expiryType === 'days'){
    const d = Number(coupon.expiryDays) || 30;
    return `本日から${d}日以内`;
  }
  if(coupon.expiryType === 'date' && coupon.expiryDate){
    const dt = new Date(coupon.expiryDate);
    if(!isNaN(dt.getTime())) return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日まで`;
    return '期限未設定';
  }
  return '無期限';
}
function renderCustomerCoupon(coupon, storeName){
  const theme = COUPON_THEMES[coupon.theme] || COUPON_THEMES.orange;
  const conds = String(coupon.conditions || '').split('\n').map(s=>s.trim()).filter(Boolean);
  const expiry = formatCouponExpiry(coupon);
  // 発行日時（YYYY-MM-DD HH:MM）。クーポン画面を開いた瞬間の日時を表示し、再利用抑止に寄与
  const _d = new Date();
  const issuedAt = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')} ${String(_d.getHours()).padStart(2,'0')}:${String(_d.getMinutes()).padStart(2,'0')}`;
  const title = coupon.title || 'ご来店ありがとうございました';
  const benefit = coupon.benefit || '';
  return `
    <div style="text-align:center;font-size:.9rem;font-weight:700;color:${theme.main};margin-bottom:.6rem">✨ アンケートご協力ありがとうございました ✨</div>
    <div style="text-align:center;font-size:1.1rem;font-weight:700;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:.7rem 0;margin-bottom:1rem">${esc(title)}</div>
    <div style="border:3px dashed ${theme.border};background:${theme.bg};color:${theme.main};border-radius:12px;padding:1.2rem .8rem;text-align:center;margin-bottom:1rem">
      <div style="font-size:.75rem;font-weight:700;letter-spacing:.2em;margin-bottom:.4rem">◆ 特典 ◆</div>
      <div style="font-size:1.4rem;font-weight:700;line-height:1.4">${esc(benefit)}</div>
    </div>
    ${conds.length ? `<ul style="font-size:.85rem;color:#555;padding-left:1.2rem;margin:0 0 .8rem;line-height:1.8">${conds.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    <div style="font-size:.85rem;color:#333;font-weight:600;margin-bottom:1rem">⏰ 有効期限：${esc(expiry)}</div>
    <div style="border-top:1px dashed #ccc;padding-top:.7rem;text-align:center;font-size:.7rem;color:#777">
      <div style="margin-bottom:.3rem;font-weight:600">※この画面をスタッフにご提示ください</div>
      <div style="font-size:.95rem;font-weight:700;color:#222">${esc(storeName || '')}</div>
      <div style="font-size:.7rem;color:#999;margin-top:.15rem">${issuedAt}</div>
    </div>
    <button class="brg" onclick="backFromCoupon()" style="margin-top:.8rem">← 口コミ画面に戻る</button>
  `;
}
function showCoupon(){
  if(!COUPON) return;
  document.getElementById('rcard').classList.remove('on');
  const cc = document.getElementById('ccard');
  if(!cc) return;
  cc.innerHTML = renderCustomerCoupon(COUPON, STORE);
  cc.classList.add('on');
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function backFromCoupon(){
  document.getElementById('ccard').classList.remove('on');
  document.getElementById('rcard').classList.add('on');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetSurvey(){
  ANS = new Array(TOTAL).fill(null);
  buildQCards();
  document.getElementById('pgw').style.display = 'block';

  document.getElementById('ccard')?.classList.remove('on');
  const bc = document.getElementById('bcoupon');
  if(bc) bc.style.display = COUPON ? '' : 'none';
  showQ(1);
}
